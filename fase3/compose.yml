services:
  usuarios:
    build:
      context: ./backend/ms-usuario
      dockerfile: Dockerfile
    ports: ["8081:8081"]
    volumes:
        - ./backend/ms-usuario:/nutrivida/backend/ms-usuario
    command: mvn spring-boot:run
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    
  admin:
    build:
      context: ./backend/ms-admin
      dockerfile: Dockerfile
    ports: ["8082:8082"]
    volumes:
        - ./backend/ms-admin:/nutrivida/backend/ms-admin
    command: mvn spring-boot:run
    environment:
      JWT_SECRET: ${JWT_SECRET}
      USUARIOS_URL: http://usuarios:8081

  reservas:
    build:
      context: ./backend/ms-reserva
      dockerfile: Dockerfile
    ports: ["8083:8083"]
    volumes:
        - ./backend/ms-reserva:/nutrivida/backend/ms-reserva
    command: mvn spring-boot:run
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

  carrito:
    build:
      context: ./backend/ms-carrito
      dockerfile: Dockerfile
    ports: ["8084:8084"]
    volumes:
        - ./backend/ms-carrito:/nutrivida/backend/ms-carrito
    command: mvn spring-boot:run
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

  planes:
    build:
      context: ./backend/ms-planes
      dockerfile: Dockerfile
    ports: ["8085:8085"]
    volumes:
        - ./backend/ms-planes:/nutrivida/backend/ms-planes
    command: mvn spring-boot:run
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["5173:80"]
    volumes:
        - ./frontend:/nutrivida/frontend
    environment:
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - admin