server:
  port: 8083
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: reserva
  profiles:
    default: postgres

  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/postgres?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mail:
    host: ://gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

logging:
  level:
    root: INFO
    com:
      nutrivida: DEBUG

reserva:
  anticipacion-maxima-meses: 6
  horario:
    apertura: "08:00"
    cierre: "21:00"

app:
  jwt-secret: ${JWT_SECRET}
