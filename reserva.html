<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js"></script>
    <title>Agenda de hora</title>
</head>
<body>
    <div id="menu">
        <h5>.Diet</h5>
        <nav class="nav flex-column">
            <a class="nav-link active" aria-current="page" href="home.html">
                <img src="img/homeIcono.png" alt="Home">
            </a>
            <a class="nav-link disabled" aria-disabled="true">Agenda</a>
            <a class="nav-link" href="logging.html">
                <img src="img/usuarioIcono.webp" alt="Usuario">
            </a>
        </nav>
    </div>
    <div class="container">
        <header>
            <div>
                <h1>Nutrivida 🍃</h1>
                <h5>Comienza una vida saludable a partir de ahora</h5>
            </div>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
        </header>
        <main>
            <form id="formulario-reserva" class="border rounded p-4 shadow bg-white">
                <table>
                    <tbody>
                        <tr>
                            <td>
                                <label>Nombre</label>
                            </td>
                            <td>
                                <input type="text" placeholder="Ingrese su nombre">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label>RUN</label>
                            </td>
                            <td>
                                <input type="text" placeholder="11111111-1">
                            </td>
                        </tr>
                        
                        <tr>
                            <td>
                                <label>Correo</label>
                            </td>
                            <td>
                                <input type="mail" placeholder="example@gmail.com">
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label>Tipo de Atención</label>
                            </td>
                            <td>
                                <select>
                                    <option>
                                        Seleccione una opción
                                    </option>
                                    <option data-tipo="consulta">
                                        Consulta
                                    </option>
                                    <option data-tipo="tipo-ev">
                                        Evaluación
                                    </option>
                                    <option data-tipo="tipo-plan">
                                        Plan especializado
                                    </option>
                                    <option data-tipo="tipo-taller">
                                        Taller grupal
                                    </option>
                                </select>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label>Servicio / Plan</label>
                            </td>
                            <td>
                                <select>
                                    <option>
                                        Seleccione una opción
                                    </option>
                                    <option class="consulta-serv d-none">
                                        Primera consulta nutricional
                                    </option>
                                    <option class="consulta-serv d-none">
                                        Control nutricional (seguimiendo)
                                    </option>
                                    <option class="consulta-serv d-none">
                                        Control nutricional quincenal
                                    </option>
                                    <option class="consulta-serv d-none">
                                        Teleconsulta nutricional
                                    </option>
                                    <option class="consulta-serv d-none">
                                        Consulta de urgencia / reagendada
                                    </option>

                                    <option class="eva-serv d-none">
                                        Antropometría completada
                                    </option>
                                    <option class="eva-serv d-none">
                                        Bioimpedanciometría
                                    </option>
                                    <option class="eva-serv d-none">
                                        Encuesta de hábitos alimentarios
                                    </option>
                                    <option class="eva-serv d-none">
                                        Análisis de exámenes de laboratorio
                                    </option>
                                    
                                    <option class="plan d-none">
                                        Plan de pérdida de peso (1 mes)
                                    </option>
                                    <option class="plan d-none">
                                        Plan de pérdida de peso (3 meses)
                                    </option>
                                    <option class="plan d-none">
                                        Plan nutrición deportiva (1 mes)
                                    </option>
                                    <option class="plan d-none">
                                        Plan control diabetes / hipertensión
                                    </option>
                                    <option class="plan d-none">
                                        Plan alimentación vegetariana / vegana
                                    </option>
                                    <option class="plan d-none">
                                        Plan alimentación infantil (2 - 12 años)
                                    </option>

                                    <option class="taller-serv d-none">
                                        Taller de alimentación saludable
                                    </option>
                                    <option class="taller-serv d-none">
                                        Taller de cocina nutritiva
                                    </option>
                                    <option class="taller-serv d-none">
                                        Taller nutrición para deportistas
                                    </option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                Selecciona tu hora
                            </td>
                            <td>
                                <input type="date">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                Horario
                            </td>
                            <td>
                                <select>
                                    <option>
                                        Seleccione una opción
                                    </option>
                                    <option>
                                        Mañana
                                    </option>
                                    <option>
                                        Tarde
                                    </option>
                                    <option>
                                        Noche
                                    </option>
                                </select>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <input type="submit" class="btn btn-success" value="Reservar hora">
            </form>
        </main>
        <footer>

        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
